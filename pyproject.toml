[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-raas"
version = "0.1.0"
description = "Point-in-time quantitative research infrastructure for equity research workflows."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "PyYAML>=6,<7",
    "scipy>=1.12,<2",
    "SQLAlchemy>=2,<3",
    "statsmodels>=0.14,<1",
    # Windows does not provide the IANA database consumed by zoneinfo.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Public data is an explicit opt-in: deterministic tests must never call Yahoo.
public-data = ["yfinance>=0.2.50,<1"]
api = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]
dashboard = [
    "plotly>=5.24,<7",
    "streamlit>=1.40,<2",
]
postgres = ["psycopg[binary]>=3.2,<4"]
calendar = ["exchange-calendars>=4.7,<5"]
# LSEG software is installable, but useful access still requires contracted
# entitlements and an approved desktop or platform session.
lseg = ["lseg-data>=2,<3"]
# Bloomberg's SDK installation channel depends on the client's environment.
# Keep this named extra as an integration boundary; follow Bloomberg's approved
# installation instructions before enabling the connector.
bloomberg = []
dev = [
    "hypothesis>=6.100,<7",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
    "types-PyYAML>=6,<7",
]

[project.scripts]
quant-raas = "quant_raas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant_raas*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
markers = [
    "integration: exercises more than one application layer without live vendors",
    "point_in_time: checks as-of availability and look-ahead protection",
    "external: requires network access, credentials, or a licensed vendor session",
    "slow: intentionally longer-running statistical or property-based coverage",
]
# Numerical warnings raised by our code are test failures. Third-party
# deprecations are not globally promoted because that would make CI dependent on
# warning behavior outside this repository.
filterwarnings = ["error::RuntimeWarning:quant_raas.*"]

[tool.coverage.run]
branch = true
source = ["quant_raas"]
omit = [
    # Phase-2 AI boundaries and delivery/demo composition are verified through
    # later evaluation or smoke suites rather than the deterministic core gate.
    "src/quant_raas/ai/*",
    "src/quant_raas/cli.py",
    "src/quant_raas/demo.py",
    "src/quant_raas/connectors/bloomberg/*",
    "src/quant_raas/connectors/lseg/*",
    "src/quant_raas/connectors/macro/*",
    "src/quant_raas/connectors/public_fallback/*",
    "src/quant_raas/connectors/sec/*",
    "src/quant_raas/research/thesis.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# The original script is retained as input to the migration and is not part of
# the maintained package. It can be removed from this exclusion after migration.
extend-exclude = ["aapl_quant_research.py", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["quant_raas"]

[tool.mypy]
python_version = "3.12"
files = ["src/quant_raas"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "statsmodels.*",
    "yfinance.*",
]
ignore_missing_imports = true

# Deterministic materiality score v0 from PLAN_codex.md.
# Component inputs are normalized to [0, 1] before this configuration is applied.
schema_version: 1
score_version: materiality-v0

score:
  components:
    estimate_change: 0.20
    abnormal_price: 0.15
    abnormal_volume: 0.10
    valuation_change: 0.10
    factor_change: 0.10
    fundamental_change: 0.10
    event_novelty: 0.10
    thesis_relevance: 0.15
  input_min: 0.0
  input_max: 1.0
  # Missing evidence contributes zero. Renormalizing available components would
  # make a sparse finding appear more material than a fully observed one.
  missing_component_policy: zero

priority:
  # priority = materiality_score * (1 + k * sqrt(abs(position_weight)))
  # Absolute weight gives short positions the same relevance treatment as longs.
  # Weight is a decimal fraction (4.2% is 0.042), not a percentage.
  # The schema retains the concise formula identifier; scoring applies it to
  # absolute weight as documented above.
  formula: sqrt_position_modifier
  k: 1.0
  unheld_position_weight: 0.0
  maximum_position_weight: 10.0

labels:
  # Thresholds are inclusive lower bounds and are evaluated from highest to lowest.
  - name: critical
    minimum_score: 0.80
  - name: material
    minimum_score: 0.65
  - name: watch
    # Phase-1 price/volume/factor/novelty evidence can contribute at most 0.45;
    # this threshold allows a strong multi-signal anomaly to enter the inbox.
    minimum_score: 0.30
  - name: routine
    minimum_score: 0.00

evidence:
  minimum_references: 1
  reject_non_finite_numbers: true
  require_source_available_at: true
